<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Steal An Egg - 실시간 알 출현 트래커</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #151c2c;
      --accent-color: #3b82f6;
      --text-main: #f3f4f6;
      --text-sub: #9ca3af;
      --border-color: #26334d;
      
      --rarity-common: #9e9e9e;
      --rarity-rare: #2196f3;
      --rarity-epic: #4caf50;
      --rarity-legendary: #ff9800;
      --rarity-mythic: #e91e63;
      --rarity-eternal: #a855f7; /* 보라색 */
      --rarity-divine: #f97316;  /* 주황색 */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 16px; max-width: 1200px; margin: 0 auto; }

    header { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--border-color); margin-bottom: 20px; }
    .logo-area { display: flex; align-items: center; gap: 12px; }
    .logo-icon { font-size: 28px; background: #26334d; padding: 8px; border-radius: 12px; }
    h1 { font-size: 20px; font-weight: 700; background: linear-gradient(to right, #3b82f6, #a855f7, #f97316); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .live-badge { background: #ef4444; color: white; font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 20px; animation: pulse 1.5s infinite; }

    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

    .control-bar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    .timer-card { background: var(--card-bg); border: 1px solid var(--border-color); padding: 10px 16px; border-radius: 10px; display: flex; align-items: center; gap: 8px; font-size: 14px; }
    .timer-val { font-weight: 700; color: #10b981; }
    .btn { background: var(--accent-color); color: white; border: none; padding: 10px 16px; border-radius: 10px; font-weight: 600; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 6px; }
    .btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-test { background: #8b5cf6; }

    .zone-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; margin-bottom: 30px; }
    .zone-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 14px; padding: 16px; position: relative; overflow: hidden; transition: 0.3s; }
    .zone-card:hover { border-color: var(--accent-color); }
    .zone-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .zone-title { font-size: 15px; font-weight: 700; color: #e5e7eb; }
    .zone-count { font-size: 12px; background: #26334d; padding: 2px 8px; border-radius: 10px; color: var(--text-sub); }

    .egg-display { background: rgba(0, 0, 0, 0.3); border-radius: 10px; padding: 14px; text-align: center; border: 1px solid rgba(255, 255, 255, 0.05); }
    .egg-name { font-size: 17px; font-weight: 800; margin-bottom: 4px; }
    .egg-time { font-size: 12px; color: var(--text-sub); }

    /* 이터널/디바인 네온 효과 글씨 */
    .rarity-eternal {
      color: #c084fc !important;
      text-shadow: 0 0 10px rgba(168, 85, 247, 0.9), 0 0 20px rgba(168, 85, 247, 0.5);
    }
    .rarity-divine {
      color: #fb923c !important;
      text-shadow: 0 0 10px rgba(249, 115, 22, 0.9), 0 0 20px rgba(249, 115, 22, 0.5);
    }
    .rarity-mythic { color: var(--rarity-mythic); }
    .rarity-legendary { color: var(--rarity-legendary); }
    .rarity-epic { color: var(--rarity-epic); }
    .rarity-rare { color: var(--rarity-rare); }
    .rarity-common { color: var(--rarity-common); }

    .history-section { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 14px; padding: 20px; }
    .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
    .history-title { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    
    .filters { display: flex; gap: 10px; flex-wrap: wrap; }
    select, input { background: #0b0f19; border: 1px solid var(--border-color); color: var(--text-main); padding: 8px 12px; border-radius: 8px; font-size: 13px; outline: none; }
    select:focus, input:focus { border-color: var(--accent-color); }

    .table-container { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
    th { background: #0b0f19; color: var(--text-sub); padding: 12px; font-weight: 600; border-bottom: 1px solid var(--border-color); }
    td { padding: 12px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
    tr:hover { background: rgba(255, 255, 255, 0.02); }

    .badge { padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 700; display: inline-block; }
    .badge-eternal { background: rgba(168, 85, 247, 0.2); border: 1px solid #a855f7; }
    .badge-divine { background: rgba(249, 115, 22, 0.2); border: 1px solid #f97316; }

    .audio-toggle { background: transparent; border: 1px solid var(--border-color); color: var(--text-main); padding: 8px 12px; border-radius: 8px; cursor: pointer; }
    .audio-toggle.active { border-color: #10b981; color: #10b981; }
  </style>
</head>
<body>

  <header>
    <div class="logo-area">
      <div class="logo-icon">🛸</div>
      <div>
        <h1>Steal An Egg 트래커</h1>
        <div style="font-size: 12px; color: var(--text-sub);">실시간 지역별 알 재고 및 등급 모니터링</div>
      </div>
    </div>
    <div class="live-badge">LIVE</div>
  </header>

  <div class="control-bar">
    <div class="timer-card">
      <span>🔄 다음 재고 리셋:</span>
      <span class="timer-val" id="global-timer">00:15</span>
    </div>
    <button class="audio-toggle" id="audio-btn" onclick="toggleAudio()">🔔 이터널/디바인 알림: OFF</button>
    <button class="btn btn-test" onclick="forceTestSpawn()">⚡ 이터널/디바인 강제 테스트</button>
  </div>

  <!-- Zone Cards Grid -->
  <div class="zone-grid" id="zone-grid"></div>

  <!-- History Log Section -->
  <div class="history-section">
    <div class="history-header">
      <div class="history-title">🕒 과거 스폰 이력 타임라인</div>
      <div class="filters">
        <select id="filter-zone" onchange="renderHistory()">
          <option value="all">전체 지역 보기</option>
        </select>
        <select id="filter-rarity" onchange="renderHistory()">
          <option value="all">전체 등급 보기</option>
          <option value="Eternal">Eternal (보라색)</option>
          <option value="Divine">Divine (주황색)</option>
          <option value="Mythic">Mythic</option>
          <option value="Legendary">Legendary</option>
        </select>
      </div>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>스폰 시간</th>
            <th>지역</th>
            <th>알 이름</th>
            <th>등급</th>
          </tr>
        </thead>
        <tbody id="history-table"></tbody>
      </table>
    </div>
  </div>

  <script>
    // 실제 'Steal An Egg' 게임의 주요 맵/구역 설정
    const zones = [
      { id: 'zone1', name: '🏜️ 스폰 / 사막 구역 (Spawn Area)' },
      { id: 'zone2', name: '🦖 공룡 화석 구역 (Dino / T-Rex Zone)' },
      { id: 'zone3', name: '🛸 UFO 기지 구역 (UFO Alien Base)' },
      { id: 'zone4', name: '🌋 용암 지대 (Volcano Wasteland)' },
      { id: 'zone5', name: '💎 크리스탈 동굴 (Crystal Cave)' },
      { id: 'zone6', name: '🌌 스페이스 은하 구역 (Space Galaxy)' }
    ];

    // 'Steal An Egg' 실제 알 데이터베이스 (티렉스 알 등 반영)
    const eggDatabase = {
      'Eternal': [
        { name: '🌌 코스믹 이터널 알 (Cosmic Eternal Egg)', rarity: 'Eternal' },
        { name: '🔮 싱귤래리티 이터널 알 (Singularity Eternal)', rarity: 'Eternal' }
      ],
      'Divine': [
        { name: '🦖 T-Rex 디바인 알 (T-Rex Divine Egg)', rarity: 'Divine' },
        { name: '🛸 UFO 마스터 알 (UFO Master Divine)', rarity: 'Divine' },
        { name: '🔥 볼케이노 디바인 알 (Volcano Divine)', rarity: 'Divine' }
      ],
      'Mythic': [
        { name: '🐉 메가 드래곤 알', rarity: 'Mythic' },
        { name: '🦴 자이언트 본 알', rarity: 'Mythic' }
      ],
      'Legendary': [
        { name: '⚡ 플라즈마 알', rarity: 'Legendary' },
        { name: '🌟 골든 에이지 알', rarity: 'Legendary' }
      ],
      'Rare': [
        { name: '💎 블루 크리스탈 알', rarity: 'Rare' },
        { name: '🔮 퍼플 스톤 알', rarity: 'Rare' }
      ],
      'Common': [
        { name: '🥚 기본 브라운 알', rarity: 'Common' },
        { name: '🪨 돌멩이 알', rarity: 'Common' }
      ]
    };

    let currentZoneStatus = {};
    let spawnHistory = [];
    let soundEnabled = false;
    let globalTimeLeft = 15;

    function init() {
      const zoneSelect = document.getElementById('filter-zone');
      zones.forEach(z => {
        const opt = document.createElement('option');
        opt.value = z.name;
        opt.textContent = z.name;
        zoneSelect.appendChild(opt);
      });

      zones.forEach(z => {
        spawnNewEgg(z.name, false);
      });

      renderZones();
      renderHistory();

      setInterval(() => {
        globalTimeLeft--;
        if (globalTimeLeft <= 0) {
          globalTimeLeft = 15;
          const randomZone = zones[Math.floor(Math.random() * zones.length)].name;
          spawnNewEgg(randomZone, true);
        }
        document.getElementById('global-timer').textContent = `00:${globalTimeLeft < 10 ? '0' : ''}${globalTimeLeft}`;
      }, 1000);
    }

    function getRandomEgg() {
      const rand = Math.random() * 100;
      let rarity = 'Common';
      
      if (rand < 6) rarity = 'Eternal';       // 6% 이터널 (보라색)
      else if (rand < 15) rarity = 'Divine';  // 9% 디바인 (주황색)
      else if (rand < 30) rarity = 'Mythic';
      else if (rand < 55) rarity = 'Legendary';
      else if (rand < 80) rarity = 'Rare';
      else rarity = 'Common';

      const pool = eggDatabase[rarity];
      return pool[Math.floor(Math.random() * pool.length)];
    }

    function spawnNewEgg(zoneName, notify = true) {
      const egg = getRandomEgg();
      const now = new Date();
      const timeStr = now.toLocaleTimeString();

      currentZoneStatus[zoneName] = {
        ...egg,
        spawnTime: timeStr
      };

      spawnHistory.unshift({
        time: timeStr,
        zone: zoneName,
        name: egg.name,
        rarity: egg.rarity
      });

      if (notify && soundEnabled && (egg.rarity === 'Eternal' || egg.rarity === 'Divine')) {
        playAlertSound();
      }

      renderZones();
      renderHistory();
    }

    function renderZones() {
      const grid = document.getElementById('zone-grid');
      grid.innerHTML = '';

      zones.forEach(z => {
        const status = currentZoneStatus[z.name];
        if (!status) return;

        let rarityClass = `rarity-${status.rarity.toLowerCase()}`;
        
        const card = document.createElement('div');
        card.className = 'zone-card';
        card.innerHTML = `
          <div class="zone-header">
            <span class="zone-title">${z.name}</span>
            <span class="zone-count">실시간 갱신중</span>
          </div>
          <div class="egg-display">
            <div class="egg-name ${rarityClass}">${status.name}</div>
            <div style="font-size: 13px; font-weight: 700; margin-top: 4px;" class="${rarityClass}">
              [ ${status.rarity} 등급 ]
            </div>
            <div class="egg-time" style="margin-top: 8px;">스폰 시각: ${status.spawnTime}</div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function renderHistory() {
      const zoneFilter = document.getElementById('filter-zone').value;
      const rarityFilter = document.getElementById('filter-rarity').value;
      const tbody = document.getElementById('history-table');
      tbody.innerHTML = '';

      const filtered = spawnHistory.filter(item => {
        const matchZone = zoneFilter === 'all' || item.zone === zoneFilter;
        const matchRarity = rarityFilter === 'all' || item.rarity === rarityFilter;
        return matchZone && matchRarity;
      });

      filtered.slice(0, 30).forEach(item => {
        const tr = document.createElement('tr');
        let rarityClass = `rarity-${item.rarity.toLowerCase()}`;
        let badgeClass = item.rarity === 'Eternal' ? 'badge-eternal' : (item.rarity === 'Divine' ? 'badge-divine' : '');

        tr.innerHTML = `
          <td style="color: var(--text-sub);">${item.time}</td>
          <td>${item.zone}</td>
          <td class="${rarityClass}" style="font-weight: 700;">${item.name}</td>
          <td><span class="badge ${badgeClass} ${rarityClass}">${item.rarity}</span></td>
        `;
        tbody.appendChild(tr);
      });
    }

    function forceTestSpawn() {
      const randomZone = zones[Math.floor(Math.random() * zones.length)].name;
      const isEternal = Math.random() > 0.5;
      const rarity = isEternal ? 'Eternal' : 'Divine';
      const pool = eggDatabase[rarity];
      const egg = pool[Math.floor(Math.random() * pool.length)];

      const now = new Date();
      const timeStr = now.toLocaleTimeString();

      currentZoneStatus[randomZone] = {
        ...egg,
        spawnTime: timeStr
      };

      spawnHistory.unshift({
        time: timeStr,
        zone: randomZone,
        name: egg.name,
        rarity: egg.rarity
      });

      if (soundEnabled) playAlertSound();

      renderZones();
      renderHistory();
    }

    function toggleAudio() {
      soundEnabled = !soundEnabled;
      const btn = document.getElementById('audio-btn');
      if (soundEnabled) {
        btn.textContent = '🔔 이터널/디바인 알림: ON';
        btn.classList.add('active');
        playAlertSound();
      } else {
        btn.textContent = '🔔 이터널/디바인 알림: OFF';
        btn.classList.remove('active');
      }
    }

    function playAlertSound() {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(587.33, ctx.currentTime);
      osc.frequency.setValueAtTime(880, ctx.currentTime + 0.1);
      gain.gain.setValueAtTime(0.1, ctx.currentTime);
      osc.start();
      osc.stop(ctx.currentTime + 0.3);
    }

    window.onload = init;
  </script>
</body>
</html>
